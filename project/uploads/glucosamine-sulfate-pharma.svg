<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Illustration of a pharmaceutical glucosamine sulfate carton with blister pack">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf2"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="216" rx="88" ry="8" fill="#000" opacity="0.10"/>
  <!-- carton -->
  <rect x="38" y="52" width="140" height="150" rx="8" fill="url(#box)" stroke="#c5cfd8" stroke-width="1.5"/>
  <rect x="38" y="52" width="140" height="34" rx="8" fill="#2e5f8a"/>
  <rect x="38" y="76" width="140" height="10" fill="#2e5f8a"/>
  <text x="108" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#ffffff">PHARMA GRADE</text>
  <text x="108" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a52">Glucosamine</text>
  <text x="108" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a52">Sulfate</text>
  <text x="108" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e5f8a">1500 mg</text>
  <text x="108" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5a6b7a">once daily &#183; crystalline</text>
  <rect x="58" y="178" width="100" height="14" rx="7" fill="#eef3f7" stroke="#c5cfd8" stroke-width="1"/>
  <text x="108" y="188.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#2e5f8a">30 SACHETS / TABLETS</text>
  <!-- blister pack -->
  <g transform="rotate(12 185 160)">
    <rect x="158" y="120" width="56" height="84" rx="8" fill="#dfe7ee" stroke="#b8c4d0" stroke-width="1.5"/>
    <g fill="#f8fafc" stroke="#aab8c6" stroke-width="1">
      <circle cx="174" cy="138" r="7"/><circle cx="198" cy="138" r="7"/>
      <circle cx="174" cy="160" r="7"/><circle cx="198" cy="160" r="7"/>
      <circle cx="174" cy="182" r="7"/><circle cx="198" cy="182" r="7"/>
    </g>
  </g>
</svg>
