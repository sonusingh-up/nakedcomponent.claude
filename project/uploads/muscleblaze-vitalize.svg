<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="MuscleBlaze Vitalize multivitamin bottle">
  <defs>
    <linearGradient id="mbvbody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2a4a"/>
      <stop offset="0.4" stop-color="#2a4080"/>
      <stop offset="0.7" stop-color="#223468"/>
      <stop offset="1" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="mbvcap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e85a00"/>
      <stop offset="0.5" stop-color="#ff7820"/>
      <stop offset="1" stop-color="#e85a00"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="226" rx="58" ry="7" fill="#000" opacity="0.10"/>
  <!-- cap -->
  <rect x="80" y="22" width="80" height="24" rx="5" fill="url(#mbvcap)" stroke="#c04a00" stroke-width="1"/>
  <!-- neck -->
  <rect x="84" y="44" width="72" height="12" fill="#223468"/>
  <!-- bottle body -->
  <path d="M70 56 C56 64 48 78 48 96 L48 198 C48 210 58 220 72 220 L168 220 C182 220 192 210 192 198 L192 96 C192 78 184 64 170 56 Z" fill="url(#mbvbody)" stroke="#1a2a4a" stroke-width="1.5"/>
  <!-- orange accent stripe -->
  <rect x="48" y="80" width="144" height="6" fill="#ff7820" opacity="0.9"/>
  <!-- label -->
  <rect x="52" y="86" width="136" height="120" rx="2" fill="#f0f4ff" stroke="#2a4080" stroke-width="0.8"/>
  <!-- MB wordmark bar -->
  <rect x="52" y="86" width="136" height="22" fill="#1a2a4a"/>
  <text x="120" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" letter-spacing="1.5" fill="#ff7820">MuscleBlaze</text>
  <!-- product name -->
  <text x="120" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1a2a4a" letter-spacing="0.5">Vitalize</text>
  <line x1="68" y1="132" x2="172" y2="132" stroke="#2a4080" stroke-width="0.8"/>
  <text x="120" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#223468" letter-spacing="0.5">Multivitamin for Adults</text>
  <!-- orange accent text -->
  <text x="120" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e85a00" font-weight="bold">WITH VITAMIN D3 · ZINC · B12</text>
  <line x1="68" y1="168" x2="172" y2="168" stroke="#c8d0e0" stroke-width="0.6"/>
  <text x="120" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="#445090">60 tablets · Made in India</text>
  <!-- orange footer -->
  <rect x="52" y="194" width="136" height="12" fill="#e85a00"/>
  <text x="120" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff" letter-spacing="0.8">GLUTEN FREE · VEGETARIAN</text>
</svg>
