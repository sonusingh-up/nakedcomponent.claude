  <text x="120" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#2a1a00">VM-75</text>
  <line x1="68" y1="128" x2="172" y2="128" stroke="#c8983e" stroke-width="1"/>
  <text x="120" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="1" fill="#4a3210">COMPREHENSIVE MULTINUTRIENT</text>
  <text x="120" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#6a5030">with Vitamin D3 · Iron-Free</text>
