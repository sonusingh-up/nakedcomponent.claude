  <!-- body -->
  <path d="M74 58 C60 66 52 80 52 100 L52 194 C52 206 62 216 74 216 L166 216 C178 216 188 206 188 194 L188 100 C188 80 180 66 166 58 Z" fill="url(#vm75body)" stroke="#5a3e14" stroke-width="1.5"/>
