  <line x1="100" y1="24" x2="100" y2="46" stroke="#9a7010" stroke-width="0.8" opacity="0.6"/>
  <line x1="120" y1="24" x2="120" y2="46" stroke="#d0a030" stroke-width="1" opacity="0.8"/>
  <line x1="140" y1="24" x2="140" y2="46" stroke="#9a7010" stroke-width="0.8" opacity="0.6"/>
