      <stop offset="0" stop-color="#7a5c2e"/>
      <stop offset="0.2" stop-color="#c8983e"/>
      <stop offset="0.5" stop-color="#e8b84a"/>
      <stop offset="0.78" stop-color="#c8983e"/>
