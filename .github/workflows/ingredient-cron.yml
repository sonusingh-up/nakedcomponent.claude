name: Generate Ingredient Pages

on:
  schedule:
    # Every 4 hours at minute 0
    - cron: '0 */4 * * *'
  # Also allow manual trigger with optional slug override
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of pages to generate'
        required: false
        default: '3'
      slug:
        description: 'Specific slug to generate (optional)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — show what would be built without writing'
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # needed to commit generated files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check queue status
        run: |
          QUEUE_LENGTH=$(node -e "
            const fs = require('fs');
            const q = JSON.parse(fs.readFileSync('scripts/ingredient-generator/queue.json','utf8'));
            console.log(q.length);
          ")
          echo "Queue length: $QUEUE_LENGTH"
          if [ "$QUEUE_LENGTH" = "0" ]; then
            echo "QUEUE_EMPTY=true" >> $GITHUB_ENV
            echo "Queue is empty — all pages have been built!"
          else
            echo "QUEUE_EMPTY=false" >> $GITHUB_ENV
          fi

      - name: Generate ingredient pages
        if: env.QUEUE_EMPTY == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Build args
          ARGS=""

          # Count (from manual trigger or default 3)
          COUNT="${{ github.event.inputs.count || '3' }}"
          ARGS="$ARGS --count $COUNT"

          # Specific slug override
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi

          # Dry run flag
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: node scripts/ingredient-generator/generate.js $ARGS"
          node scripts/ingredient-generator/generate.js $ARGS

      - name: Check for new files
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
            echo "No files changed"
          else
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            echo "Changed files:"
            git diff --cached --name-only
          fi

      - name: Commit and push generated pages
        if: env.HAS_CHANGES == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Naked Compound Bot"

          # Summarise what was built
          BUILT=$(git diff --cached --name-only | grep 'pages/ingredients/' | grep -v 'ingredients.html' | sed 's|project/pages/ingredients/||' | sed 's|\.html||' | tr '\n' ', ' | sed 's|, $||')

          QUEUE_REMAINING=$(node -e "
            const fs = require('fs');
            const q = JSON.parse(fs.readFileSync('scripts/ingredient-generator/queue.json','utf8'));
            console.log(q.length);
          ")

          git commit -m "feat: auto-generate ingredient pages [$BUILT]

          Generated by GitHub Actions cron job.
          Queue remaining: $QUEUE_REMAINING / 312"

          git push

      - name: Summary
        if: always()
        run: |
          echo "### Ingredient Generator Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$QUEUE_EMPTY" = "true" ]; then
            echo "✅ All ingredient pages have been generated!" >> $GITHUB_STEP_SUMMARY
          else
            QUEUE_REMAINING=$(node -e "
              const fs = require('fs');
              const q = JSON.parse(fs.readFileSync('scripts/ingredient-generator/queue.json','utf8'));
              console.log(q.length);
            " 2>/dev/null || echo "unknown")
            echo "📄 Queue remaining: **$QUEUE_REMAINING** ingredients" >> $GITHUB_STEP_SUMMARY

            BUILT_TODAY=$(node -e "
              const fs = require('fs');
              if (!fs.existsSync('scripts/ingredient-generator/progress.json')) { console.log('0'); process.exit(); }
              const p = JSON.parse(fs.readFileSync('scripts/ingredient-generator/progress.json','utf8'));
              const today = new Date().toISOString().slice(0,10);
              const count = p.built.filter(b => b.ts.startsWith(today)).length;
              console.log(count);
            " 2>/dev/null || echo "unknown")
            echo "✅ Built today: **$BUILT_TODAY** pages" >> $GITHUB_STEP_SUMMARY

            if [ "$HAS_CHANGES" = "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "New files committed and pushed. Vercel will auto-deploy." >> $GITHUB_STEP_SUMMARY
            fi
          fi

